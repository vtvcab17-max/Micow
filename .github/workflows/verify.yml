name: Kiem chung Micow
# Cổng kiểm chứng: ./init.sh (kiểm tra tĩnh + unittest + kiểm thử giao diện Chromium) cho mỗi lần đẩy và PR.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e . && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: bash init.sh
