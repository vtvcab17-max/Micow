<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=JetBrains+Mono:wght@600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Khuôn video giới thiệu sản phẩm Beta: mỗi cảnh ứng với một đoạn lời thoại, phụ đề theo từng câu. */
:root{--ink:#111216;--panel:#1a1b21;--gr:#26272f;--fg:#ecebf3;--mu:#9a99a8;--gold:#f2c14e;--ac:#7b6cf6;--ac2:#7b6cf6;
  --fd:"Unbounded",sans-serif;--fb:"Be Vietnam Pro",sans-serif;--fm:"JetBrains Mono",monospace;--u:min(1vw,1.78vh)}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--fb)}
body.v{--u:min(1.78vw,1vh)}
#bg{position:absolute;inset:0;background:radial-gradient(65% 55% at 50% 42%,color-mix(in srgb,var(--ac) calc(var(--glow,.3)*45%),transparent) 0%,transparent 72%)}
.top{position:absolute;top:calc(var(--u)*4);left:calc(var(--u)*5);right:calc(var(--u)*5);display:flex;justify-content:space-between;align-items:center;z-index:5}
.top .app{display:flex;align-items:center;gap:calc(var(--u)*1.2);font:700 calc(var(--u)*2.2)/1 var(--fd)}
.top .app img{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4)}
.top .beta{height:calc(var(--u)*3.4);opacity:.9}
.sc{position:absolute;left:0;right:0;top:0;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.6);padding:calc(var(--u)*10) calc(var(--u)*6) 0;text-align:center;opacity:0}
body.v .sc{bottom:38%;padding-top:calc(var(--u)*12)}
.k{font:600 calc(var(--u)*1.6)/1.2 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--ac2)}
h2{font:700 calc(var(--u)*5.6)/1.06 var(--fd);letter-spacing:-.035em;max-width:17ch}
body.v h2{font-size:calc(var(--u)*6.6);max-width:13ch}
h2 em{font-style:normal;color:var(--ac2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.1);max-width:min(88vw,calc(var(--u)*110))}
.chip{font:700 calc(var(--u)*2.2)/1 var(--fb);padding:calc(var(--u)*1.4) calc(var(--u)*2.4);border-radius:99px;background:var(--panel);border:calc(var(--u)*.18) solid var(--gr);opacity:0;transform:translateY(calc(var(--u)*2))}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* minh hoạ */
.art{width:min(84vw,calc(var(--u)*92));position:relative}
.tl{display:grid;gap:calc(var(--u)*.8);padding:calc(var(--u)*2);border-radius:calc(var(--u)*2.4);background:var(--panel);position:relative}
.tl .tr{position:relative;height:calc(var(--u)*3.6);border-radius:calc(var(--u)*1);background:#15161c}
.tl .tr i{position:absolute;top:calc(var(--u)*.6);bottom:calc(var(--u)*.6);border-radius:calc(var(--u)*.8)}
.ph{position:absolute;top:calc(var(--u)*-1);bottom:calc(var(--u)*-1);width:calc(var(--u)*.35);background:var(--gold);box-shadow:0 0 calc(var(--u)*2) var(--gold)}
.ph b{position:absolute;bottom:102%;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 calc(var(--u)*1.7)/1 var(--fm);color:#120f2a;background:var(--gold);padding:calc(var(--u)*.6) calc(var(--u)*1.1);border-radius:99px}
.lay{display:flex;justify-content:center;height:calc(var(--u)*18)}
.lay svg{height:100%;overflow:visible}
.chat{display:grid;gap:calc(var(--u)*1.4);width:min(84vw,calc(var(--u)*70))}
.chat p{font:600 calc(var(--u)*2.4)/1.35 var(--fb);padding:calc(var(--u)*1.6) calc(var(--u)*2.2);border-radius:calc(var(--u)*2.2);max-width:85%;opacity:0}
.chat .me{justify-self:end;background:var(--ac);color:#fff;border-bottom-right-radius:calc(var(--u)*.6)}
.chat .ai{justify-self:start;background:var(--panel);border-bottom-left-radius:calc(var(--u)*.6)}
.nodes{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);flex-wrap:wrap}
.nodes i{font:700 calc(var(--u)*2.3)/1 var(--fb);font-style:normal;padding:calc(var(--u)*2) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.6);background:var(--panel);border:calc(var(--u)*.2) solid var(--gr)}
.nodes i.on{background:#3b2f86;border-color:var(--ac)}
.nodes b{width:calc(var(--u)*4);height:calc(var(--u)*.4);background:var(--gr);border-radius:99px}
.nodes b.on{background:var(--ac2)}
.wave{position:relative;display:flex;align-items:center;gap:calc(var(--u)*.35);height:calc(var(--u)*16);margin-top:calc(var(--u)*4)}
.wave i{flex:1;border-radius:99px;background:var(--gr)}
.wave i.on{background:var(--ac)}
.flash{position:absolute;inset:0;background:var(--ac);opacity:0;pointer-events:none;z-index:4}
/* cảnh cuối */
.end img.logo{width:calc(var(--u)*14);height:calc(var(--u)*14)}
.end .nm{font:700 calc(var(--u)*9)/1 var(--fd);letter-spacing:-.05em}
.end .by{display:flex;align-items:center;gap:calc(var(--u)*1.2);font:600 calc(var(--u)*2.2)/1 var(--fb);color:var(--mu)}
.end .by img{height:calc(var(--u)*3.6)}
.url{font:700 calc(var(--u)*2.3)/1.2 var(--fm);color:#fff;background:var(--ac);padding:calc(var(--u)*1.6) calc(var(--u)*2.8);border-radius:99px;max-width:92vw;white-space:nowrap}
body.v .url{font-size:calc(var(--u)*1.55)}
/* phụ đề */
.sub{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:79%;display:flex;justify-content:center;z-index:6}
body.v .sub{top:64%}
.sub span{display:inline-block;font:800 calc(var(--u)*3.1)/1.3 var(--fb);text-align:center;background:rgba(10,10,14,.78);padding:calc(var(--u)*1) calc(var(--u)*2);border-radius:calc(var(--u)*1.4);max-width:30ch;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.v .sub span{font-size:calc(var(--u)*3.8);max-width:20ch}
</style>
</head>
<body>
<div id="bg"></div>
<div class="top"><div class="app"><img id="appLogo" alt=""><span id="appName"></span></div><img class="beta" id="betaLogo" alt=""></div>
<div id="root"></div>
<div class="flash" id="flash"></div>
<div class="sub"><span id="sub"></span></div>
<script>
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
let C, T, scenes = [], tail = 2.2;
// mỗi loại minh hoạ: html + hàm vẽ theo thời gian cục bộ lt (giây) và độ dài cảnh d
const ART = {
  chips: s => ({ html: '<div class="chips">' + s.chips.map(c => '<span class="chip">' + c + '</span>').join("") + '</div>',
    draw: (e, lt) => e.querySelectorAll(".chip").forEach((c, i) => { const p = ease((lt - .25 - i * .22) / .35); c.style.opacity = p; c.style.transform = "translateY(" + (1 - p) * 2 + "vh)"; }) }),
  timeline: s => ({ html: '<div class="art"><div class="tl">' + [[[2,30,"#3b2f86"],[34,30,"#2b5f57"],[66,30,"#5a3b2e"]],[[10,40,"#4a3fa0"],[56,26,"#3b2f86"]],[[0,96,"#24324a"]]].map(r => '<div class="tr">' + r.map(([l,w,c]) => '<i style="left:' + l + '%;width:' + w + '%;background:' + c + '"></i>').join("") + '</div>').join("") + '<span class="ph"><b>00:00</b></span></div></div>' + ART.chips(s).html,
    draw: (e, lt, d) => { const p = Math.min(1, lt / d), ph = e.querySelector(".ph"); ph.style.left = (4 + p * 90) + "%"; ph.querySelector("b").textContent = "00:" + String(Math.floor(p * 12)).padStart(2, "0") + "." + Math.floor((p * 120) % 10); ART.chips(s).draw(e, lt - .5); } }),
  layers: s => ({ html: '<div class="lay"><svg viewBox="0 4 96 88"><path class="m1" d="M7 86Q0 86 2.8 79.6L25.2 28.4Q28 22 30.8 28.4L53.2 79.6Q56 86 49 86Z" fill="#2fd0ee" style="mix-blend-mode:screen"/><path class="m2" d="M27 86Q20 86 22.8 79.6L45.2 28.4Q48 22 50.8 28.4L73.2 79.6Q76 86 69 86Z" fill="#ff4f99" style="mix-blend-mode:screen"/><path class="m3" d="M47 86Q40 86 42.8 79.6L65.2 28.4Q68 22 70.8 28.4L93.2 79.6Q96 86 89 86Z" fill="#ffd43b" style="mix-blend-mode:screen"/></svg></div>' + ART.chips(s).html,
    draw: (e, lt) => { const p = ease((lt - .3) / 1.2); e.querySelector(".m1").style.transform = "translate(" + (-14 * p) + "px," + (4 * p) + "px)"; e.querySelector(".m3").style.transform = "translate(" + (14 * p) + "px," + (-4 * p) + "px)"; e.querySelector(".m2").style.transform = "translateY(" + (-9 * p) + "px)"; ART.chips(s).draw(e, lt - .6); } }),
  chat: s => ({ html: '<div class="chat"><p class="me">' + s.me + '</p><p class="ai">' + s.ai + '</p></div>',
    draw: (e, lt) => { const [a, b] = e.querySelectorAll(".chat p"); a.style.opacity = ease((lt - .2) / .3); b.style.opacity = ease((lt - 1.2) / .3); } }),
  nodes: s => ({ html: '<div class="nodes">' + s.nodes.map((n, i) => (i ? "<b></b>" : "") + "<i>" + n + "</i>").join("") + '</div>' + (s.chips ? ART.chips(s).html : ""),
    draw: (e, lt) => { [...e.querySelector(".nodes").children].forEach((x, i) => x.classList.toggle("on", s.run ? lt > .6 + i * .45 : lt > .3 + i * .25)); if (s.chips) ART.chips(s).draw(e, lt - 1.5); } }),
  wave: s => ({ html: '<div class="art"><div class="wave">' + Array.from({ length: 64 }, (_, i) => '<i style="height:' + ((i < 30 ? 22 : 50) + ((i * 37) % 45)) + '%"></i>').join("") + '<span class="ph"><b>drop @ 7s</b></span></div></div>' + ART.chips(s).html,
    draw: (e, lt, d) => { const p = Math.min(.47, lt / d * .6); e.querySelector(".ph").style.left = (p * 100) + "%"; e.querySelectorAll(".wave i").forEach((b, i) => b.classList.toggle("on", i / 64 <= p && i / 64 >= .2)); ART.chips(s).draw(e, lt - .4); } }),
  none: () => ({ html: "", draw: () => {} })
};
window.setup = function (cfg, timing, vert) {
  C = cfg; T = timing; if (vert) document.body.classList.add("v");
  document.documentElement.style.setProperty("--ac", cfg.ac); document.documentElement.style.setProperty("--ac2", cfg.ac2 || cfg.ac);
  appLogo.src = cfg.logo; appName.textContent = cfg.name; betaLogo.src = cfg.beta;
  const segs = T.segs;
  scenes = cfg.scenes.map((s, i) => {
    const el = document.createElement("section"); el.className = "sc" + (s.end ? " end" : "");
    const art = s.end ? ART.none() : ART[s.art || "none"](s);
    el.innerHTML = s.end
      ? '<img class="logo" src="' + cfg.logo + '"><div class="nm">' + cfg.name + '</div><div class="by">sản phẩm của <img src="' + cfg.betaLock + '"></div><div class="url">' + cfg.url + '</div>'
      : (s.k ? '<div class="k">' + s.k + '</div>' : "") + '<h2>' + s.h + '</h2>' + art.html;
    root.appendChild(el);
    const a = segs[i].start, b = i === cfg.scenes.length - 1 ? T.dur + tail : segs[i + 1].start;
    return { el, a, b, art, drop: s.drop };
  });
  return T.dur + tail;
};
window.draw = function (t) {
  const dropAt = (scenes.find(s => s.drop) || {}).a;
  bg.style.setProperty("--glow", .3 + (dropAt != null && t >= dropAt ? .35 * Math.exp(-((t - dropAt) % (60 / C.bpm)) * 6) + .15 : 0));
  flash.style.opacity = dropAt != null && t >= dropAt && t < dropAt + .4 ? (1 - (t - dropAt) / .4) * .8 : 0;
  scenes.forEach((s, i) => {
    const on = t >= s.a && t < s.b, lt = t - s.a, inn = ease(lt / .35), out = i === scenes.length - 1 ? 1 : 1 - ease((t - (s.b - .18)) / .18);
    s.el.style.opacity = on ? Math.min(inn, out) : 0; s.el.style.visibility = on ? "visible" : "hidden";
    s.el.style.transform = on ? "translateY(" + (1 - inn) * 2.5 + "vh)" : "none";
    if (on) s.art.draw(s.el, lt, s.b - s.a);
  });
  let txt = ""; T.segs.forEach(g => g.sent.forEach(x => { if (t >= x.start - .05 && t < x.end + .25) txt = x.text; }));
  sub.textContent = txt; sub.parentElement.style.opacity = txt ? 1 : 0;
};
</script>
</body>
</html>
<style>
/* bản ngang: nội dung gọn hơn để phụ đề có chỗ riêng */
body:not(.v) .sc{bottom:27%;padding-top:calc(var(--u)*8);gap:calc(var(--u)*2)}
body:not(.v) h2{font-size:calc(var(--u)*4.6);max-width:22ch}
body:not(.v) .sub{top:76%}
body:not(.v) .sub span{font-size:calc(var(--u)*2.5);max-width:44ch}
body:not(.v) .end img.logo{width:calc(var(--u)*10);height:calc(var(--u)*10)}
body:not(.v) .end .nm{font-size:calc(var(--u)*6.4)}
body:not(.v) .art{width:min(70vw,calc(var(--u)*76))}
body:not(.v) .chip{font-size:calc(var(--u)*1.9)}
</style>
